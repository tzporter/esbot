services:
  frontend:
    build: ./frontend
    container_name: esbot-frontend-app
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://backend:8000/api/v1
    depends_on:
      - backend

  backend:
    build: ./backend
    container_name: esbot-backend-app
    volumes:
      - ./:/app
    working_dir: /app/backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql://esbot_user:esbot_password@db:5432/esbot
      GROQ_API_KEY: ${GROQ_API_KEY:-mock_key}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
    ports:
      - "8000:8000"
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: esbot-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: esbot
      POSTGRES_USER: esbot_user
      POSTGRES_PASSWORD: esbot_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data: