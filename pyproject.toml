[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
exclude = [".venv", "__pycache__", "migrations"]

[tool.ruff.lint.per-file-ignores]
"backend/features/**/*.py" = ["F811"]

[tool.bandit]
exclude_dirs = ["tests", "backend/tests", ".venv", "features", "backend/features"]
skips = []